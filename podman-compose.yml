version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techjobs-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL:?Set SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:?Set SUPABASE_SERVICE_KEY}
      - JOBS_STORAGE_BUCKET=${JOBS_STORAGE_BUCKET:-jobs-feed}
      - JOBS_STORAGE_OBJECT=${JOBS_STORAGE_OBJECT:-jobs.json}
      - CORS_ORIGIN=http://localhost:8080
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=http://localhost:8080/auth/google/callback
      - FRONTEND_URL=http://localhost:8080
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - techjobs-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUBMIT_COMPANY_URL: ${VITE_SUBMIT_COMPANY_URL:-}
    container_name: techjobs-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - techjobs-network

networks:
  techjobs-network:
    name: techjobs-network
    driver: bridge
